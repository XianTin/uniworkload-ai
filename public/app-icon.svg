<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" filter="url(#shadow)" />
  <rect width="512" height="256" rx="112" fill="url(#shine)" />

  <!-- Calendar Body -->
  <g transform="translate(100, 100)" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="24" width="312" height="288" rx="44" stroke="#ffffff" stroke-width="26" />
    <line x1="84" y1="0" x2="84" y2="48" />
    <line x1="228" y1="0" x2="228" y2="48" />
    <line x1="0" y1="104" x2="312" y2="104" />
    
    <!-- AI Sparkle & Checkmark -->
    <path d="M96 200 L140 244 L224 160" stroke="#38bdf8" stroke-width="28" />
    <circle cx="240" cy="70" r="12" fill="#38bdf8" stroke="none" />
  </g>
</svg>
